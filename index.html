<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنجاز للإرساليات والخدمات الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" />
    <script>
      (function() {
        var hash = window.location.hash;
        var saved = sessionStorage.getItem('injaz_view_mode');
        if (hash === '#adminmanager' || saved === 'login' || saved === 'admin') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      #injaz-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f7fb;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #injaz-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-ring {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 28px;
      }

      .splash-ring svg.spinner {
        position: absolute;
        inset: 0;
        width: 110px;
        height: 110px;
        animation: spin 1.6s linear infinite;
      }
      .splash-ring svg.spinner circle {
        fill: none;
        stroke: #10b981;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 220;
        stroke-dashoffset: 160;
        opacity: 0.85;
      }

      .splash-icon-box {
        position: absolute;
        inset: 10px;
        border-radius: 22px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(16,185,129,0.35);
        animation: iconPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.15s both;
      }
      .splash-icon-box svg {
        width: 44px;
        height: 44px;
        color: #fff;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
      }

      .splash-name {
        font-family: 'Cairo', 'Tajawal', 'Inter', sans-serif;
        font-size: 19px;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.4s forwards;
        direction: rtl;
        text-align: center;
      }
      .splash-sub {
        font-family: 'Cairo', 'Tajawal', 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 40px;
        opacity: 0;
        animation: fadeUp 0.5s ease 0.55s forwards;
        direction: rtl;
        text-align: center;
      }

      .splash-dots {
        display: flex;
        gap: 7px;
        opacity: 0;
        animation: fadeUp 0.4s ease 0.7s forwards;
      }
      .splash-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #10b981;
        animation: dotBounce 1.1s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.17s; background: #34d399; }
      .splash-dots span:nth-child(3) { animation-delay: 0.34s; background: #6ee7b7; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes iconPop {
        from { transform: scale(0.55); opacity: 0; }
        to   { transform: scale(1);    opacity: 1; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes dotBounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
        40%            { transform: scale(1.2); opacity: 1; }
      }
    </style>
   <script type="module" src="/main.tsx"></script>

    <link rel="stylesheet" crossorigin href="/assets/inde...

  </head>
  <body>
    <!-- Splash Screen -->
    <div id="injaz-splash">
      <div class="splash-ring">
        <svg class="spinner" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="50"/>
        </svg>
        <div class="splash-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
      </div>
      <div class="splash-name">إنجاز للإرساليات والخدمات</div>
      <div class="splash-sub">جاري التحميل...</div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
  </body>
</html>
